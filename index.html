
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Устричный мир</title>

    <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #16414c 0%,
                    #061b22 55%,
                    #01080b 100%
                );

            color: white;
            font-family: Arial, sans-serif;
        }

        #oyster-app {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }

        #oyster-globe {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;
        }

        /* Заголовок */

        .oyster-header {
            position: absolute;
            top: 35px;
            left: 45px;
            z-index: 10;

            max-width: 430px;

            pointer-events: none;
        }

        .oyster-header h1 {
            margin: 0 0 12px;

            font-family: Georgia, serif;
            font-size: 58px;
            font-weight: normal;
            line-height: 1;
            white-space: nowrap;
        }

        .oyster-header p {
            margin: 0;

            color: rgba(255, 255, 255, 0.72);
            font-size: 18px;
            line-height: 1.4;
        }

        /* Маркеры устриц */

        .oyster-marker {
            position: relative;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 48px;
            height: 48px;

            padding: 0;

            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;

            background: rgba(4, 26, 31, 0.94);
            color: white;

            font-family: Arial, sans-serif;
            font-size: 25px;

            cursor: pointer;
            pointer-events: auto;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .oyster-marker:hover {
            background: white;

            transform: scale(1.2);

            box-shadow:
                0 0 0 7px rgba(255, 255, 255, 0.14),
                0 10px 30px rgba(0, 0, 0, 0.35);
        }

        /* Карточка */

        .oyster-card {
            position: absolute;
            top: 50%;
            right: 30px;
            z-index: 20;

            width: 350px;
            max-height: calc(100vh - 60px);
            overflow-y: auto;

            padding: 27px;

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 22px;

            background: rgba(5, 25, 30, 0.96);
            backdrop-filter: blur(14px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transform:
                translateY(-50%)
                translateX(40px);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease,
                visibility 0.3s;
        }

        .oyster-card.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transform:
                translateY(-50%)
                translateX(0);
        }

        .oyster-card-close {
            position: absolute;
            top: 13px;
            right: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 36px;
            height: 36px;

            padding: 0;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.1);
            color: white;

            font-size: 23px;

            cursor: pointer;
        }

        .oyster-card-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .oyster-country {
            margin-bottom: 10px;

            color: #9ed1c7;

            font-size: 13px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .oyster-card h2 {
            margin: 0 40px 15px 0;

            font-family: Georgia, serif;
            font-size: 33px;
            font-weight: normal;
            line-height: 1.1;
        }

        .oyster-card-description {
            margin: 0 0 20px;

            color: rgba(255, 255, 255, 0.78);

            font-size: 15px;
            line-height: 1.55;
        }

        .oyster-info {
            display: grid;
            grid-template-columns: 95px 1fr;
            gap: 12px;

            padding: 11px 0;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.1);
        }

        .oyster-info strong {
            color: rgba(255, 255, 255, 0.48);
            font-weight: normal;
        }

        .oyster-info span {
            color: rgba(255, 255, 255, 0.92);
            line-height: 1.4;
        }

        /* Сообщение о загрузке */

        #loading-message {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 100;

            padding: 18px 25px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;

            background: rgba(5, 25, 30, 0.9);
            color: rgba(255, 255, 255, 0.82);

            transform: translate(-50%, -50%);
        }

        #error-message {
            display: none;

            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 101;

            width: min(600px, calc(100% - 50px));

            padding: 25px;

            border-radius: 16px;

            background: rgba(90, 15, 15, 0.96);
            color: white;

            transform: translate(-50%, -50%);
        }

        .globe-hint {
            position: absolute;
            left: 50%;
            bottom: 20px;
            z-index: 10;

            color: rgba(255, 255, 255, 0.48);
            font-size: 13px;

            transform: translateX(-50%);

            pointer-events: none;
        }

        @media (max-width: 760px) {
            .oyster-header {
                top: 24px;
                left: 22px;

                max-width: 280px;
            }

            .oyster-header h1 {
                font-size: 40px;
            }

            .oyster-header p {
                font-size: 14px;
            }

            .oyster-card {
                top: auto;
                right: 12px;
                bottom: 12px;
                left: 12px;

                width: auto;
                max-height: 50vh;

                transform: translateY(40px);
            }

            .oyster-card.open {
                transform: translateY(0);
            }

            .globe-hint {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main id="oyster-app">

        <section class="oyster-header">
            <h1>Устричный мир</h1>

            <p>
                Вращайте глобус и нажимайте<br>
                на устриц, чтобы узнать подробнее
            </p>
        </section>

        <div id="oyster-globe"></div>

        <aside
            id="oyster-card"
            class="oyster-card"
        >
            <button
                id="oyster-card-close"
                class="oyster-card-close"
                type="button"
                aria-label="Закрыть карточку"
            >
                ×
            </button>

            <div
                id="oyster-country"
                class="oyster-country"
            ></div>

            <h2 id="oyster-name"></h2>

            <p
                id="oyster-description"
                class="oyster-card-description"
            ></p>

        </aside>

        <div id="loading-message">
            Загружаем глобус и границы стран…
        </div>

        <div id="error-message"></div>

        <div class="globe-hint">
            Перетаскивайте глобус мышью · Колёсико изменяет масштаб
        </div>

    </main>

                lat: 56,
                lng: 3,
                size: 0.32
            },
            {
                name: "CARIBBEAN SEA",
                lat: 15,
                lng: -75,
                size: 0.35
            },
            {
                name: "RED SEA",
                lat: 20,
                lng: 38,
                size: 0.29
            },
            {
                name: "ARABIAN SEA",
                lat: 14,
                lng: 64,
                size: 0.34
            },
            {
                name: "SOUTH CHINA SEA",
                lat: 13,
                lng: 114,
                size: 0.32
            },
            {
                name: "SEA OF JAPAN",
                lat: 40,
                lng: 135,
                size: 0.30
            },
            {
                name: "BERING SEA",
                lat: 58,
                lng: -178,
                size: 0.31
            }
        ];

            const globeContainer =
                document.getElementById("oyster-globe");

            /*
            Создаём глобус.
            */

            const oysterGlobe =
                Globe()(globeContainer)

                /*
                Более качественная текстура Земли.

                Она тяжелее прежней, поэтому первая загрузка
                может занять немного больше времени.
                */

                .globeImageUrl(
                    "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
                )

                .bumpImageUrl(
                    "https://unpkg.com/three-globe/example/img/earth-topology.png"
                )

                .backgroundColor(
                    "rgba(0, 0, 0, 0)"
                )

                /*
                Атмосфера.
                */

                .showAtmosphere(true)

                .atmosphereColor(
                    "#69c9de"
                )

                .atmosphereAltitude(
                    0.18
                )

                /*
                Устричные маркеры.
                */

                .htmlElementsData(
                    oysterData
                )

                .htmlLat(function (oyster) {
                    return oyster.lat;
                })

                .htmlLng(function (oyster) {
                    return oyster.lng;
                })

                .htmlAltitude(0.025)

                .htmlElement(function (oyster) {

                    const marker =
                        document.createElement("button");

                    marker.className =
                        "oyster-marker";

                    marker.type =
                        "button";

                    marker.textContent =
                        "🦪";

                    marker.title =
                        oyster.name;

                    marker.setAttribute(
                        "aria-label",
                        "Открыть описание устрицы " +
                        oyster.name
                    );

                    marker.style.pointerEvents =
                        "auto";

                    marker.addEventListener(
                        "pointerdown",
                        function (event) {
                            event.stopPropagation();
                        }
                    );

                    marker.addEventListener(
                        "mousedown",
                        function (event) {
                            event.stopPropagation();
                        }
                    );

                    marker.addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();
                            event.stopPropagation();

                            showOysterCard(oyster);

                            oysterGlobe.pointOfView(
                                {
                                    lat: oyster.lat,
                                    lng: oyster.lng,
                                    altitude: 1.7
                                },
                                900
                            );
                        }
                    );

                    return marker;
                });

            /*
            Размер и положение камеры.
            */

            oysterGlobe
                .width(window.innerWidth)
                .height(window.innerHeight);

            oysterGlobe.pointOfView({
                lat: 45,
                lng: 10,
                altitude: 3
            });

            /*
            Загрузка границ стран.
            */

            try {
                const countryResponse = await fetch(
                    "https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson"
                );

                if (!countryResponse.ok) {
                    throw new Error(
                        "Не удалось загрузить GeoJSON стран"
                    );
                }

                const countriesGeoJson =
                    await countryResponse.json();

                /*
                Границы и прозрачная заливка стран.
                */

                oysterGlobe

                    .polygonsData(
                        countriesGeoJson.features
                    )

                    .polygonGeoJsonGeometry(
                        function (country) {
                            return country.geometry;
                        }
                    )

                    .polygonAltitude(
                        0.006
                    )

                    .polygonCapColor(
                        function () {
                            return "rgba(15, 70, 75, 0.10)";
                        }
                    )

                    .polygonSideColor(
                        function () {
                            return "rgba(40, 120, 125, 0.06)";
                        }
                    )

                    .polygonStrokeColor(
                        function () {
                            return "rgba(235, 244, 235, 0.70)";
                        }
                    )

                    .polygonLabel(
                        function (country) {
                            const properties =
                                country.properties || {};

                            return (
                                properties.ADMIN ||
                                properties.NAME ||
                                ""
                            );
                        }
                    );

                /*
                Создаём отдельные подписи стран.

                Координаты LABEL_X и LABEL_Y уже присутствуют
                в используемом наборе данных Natural Earth.
                */

                const countryLabels =
                    countriesGeoJson.features

                    .map(function (country) {

                        const properties =
                            country.properties || {};

                        const lat =
                            Number(properties.LABEL_Y);

                        const lng =
                            Number(properties.LABEL_X);

                        const text =
                            properties.ADMIN ||
                            properties.NAME ||
                            "";

                        const rank =
                            Number(
                                properties.LABELRANK || 10
                            );

                        return {
                            text: text,
                            lat: lat,
                            lng: lng,
                            rank: rank,
                            type: "country"
                        };
                    })

                    .filter(function (label) {
                        return (
                            label.text &&
                            Number.isFinite(label.lat) &&
                            Number.isFinite(label.lng) &&
                            label.rank <= 5
                        );
                    });

                /*
                Добавляем названия океанов
                к названиям стран.
                */

                const allLabels = [
                    ...countryLabels,

                    ...oceanLabels.map(function (ocean) {
                        return {
                            text: ocean.name,
                            lat: ocean.lat,
                            lng: ocean.lng,
                            size: ocean.size,
                            type: "ocean"
                        };
                    })
                ];

                oysterGlobe

                    .labelsData(
                        allLabels
                    )

                    .labelLat(
                        function (label) {
                            return label.lat;
                        }
                    )

                    .labelLng(
                        function (label) {
                            return label.lng;
                        }
                    )

                    .labelAltitude(
                        function (label) {
                            return label.type === "ocean"
                                ? 0.012
                                : 0.018;
                        }
                    )

                    .labelText(
                        function (label) {
                            return label.text;
                        }
                    )

                    .labelSize(
                        function (label) {

                            if (label.type === "ocean") {
                                return label.size || 0.9;
                            }

                            if (label.rank <= 2) {
                                return 0.58;
                            }

                            if (label.rank <= 4) {
                                return 0.45;
                            }

                            return 0.34;
                        }
                    )

                    .labelColor(
                        function (label) {

                            if (label.type === "ocean") {
                                return "rgba(185, 225, 240, 0.72)";
                            }

                            return "rgba(255, 250, 225, 0.92)";
                        }
                    )

                    .labelResolution(3)

                    .labelIncludeDot(false)

                    .labelDotRadius(0)

                    .labelLabel(
                        function (label) {
                            return label.text;
                        }
                    );

                loadingMessage.style.display =
                    "none";

            } catch (error) {

                loadingMessage.style.display =
                    "none";

                console.error(error);

                /*
                Сам глобус продолжит работать,
                даже если границы не загрузились.
                */

                errorMessage.style.display =
                    "block";

                errorMessage.innerHTML = `
                    <strong>
                        Глобус загрузился, но не удалось
                        получить границы стран.
                    </strong>

                    <p>
                        Возможно, корпоративная сеть блокирует
                        GitHub. Маркеры устриц при этом должны работать.
                    </p>
                `;
            }

            /*
            Управление глобусом.
            */

            const controls =
                oysterGlobe.controls();
            
            controls.autoRotate = false;
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            
            controls.minDistance = 120;
            controls.maxDistance = 500;

            /*
            Карточка.
            */

            const oysterCard =
                document.getElementById(
                    "oyster-card"
                );

            function showOysterCard(oyster) {

                document
                    .getElementById("oyster-name")
                    .textContent = oyster.name;

                document
                    .getElementById("oyster-country")
                    .textContent = oyster.country;

                document
                    .getElementById("oyster-description")
                    .innerHTML = oyster.description;


                oysterCard.classList.add(
                    "open"
                );

                controls.autoRotate = false;
            }

            document
                .getElementById(
                    "oyster-card-close"
                )
                .addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();
                        event.stopPropagation();

                        oysterCard.classList.remove(
                            "open"
                        );

                        controls.autoRotate = false;
                    }
                );

            window.addEventListener(
                "resize",
                function () {

                    oysterGlobe
                        .width(window.innerWidth)
                        .height(window.innerHeight);
                }
            );
        });
    </script>
</body>
</html>
